# Alembic configuration file for Hellio HR API.
# Run alembic commands from the api/ directory:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "description"

[alembic]
# Path to the alembic directory, relative to this file (api/).
script_location = alembic

# The database URL is read from the DATABASE_URL environment variable in
# env.py, so the value here is intentionally left as a placeholder.
# Do NOT hard-code credentials here.
sqlalchemy.url = postgresql+asyncpg://hellio:hellio@localhost:5432/hellio

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
