services:
  db:
    # pgvector/pgvector:pg16 adds the vector extension; enabled via migration 0004.
    # After swapping the image run: alembic upgrade head
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hellio
      POSTGRES_USER: hellio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://hellio:${POSTGRES_PASSWORD}@db/hellio
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./src/data:/data/seed
      - ./CVsJobs:/data/cvsjobs

volumes:
  pgdata:
